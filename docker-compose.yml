version: '3.8'

services:
  app:
    build: .
    container_name: lab_docker_app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: lab_user
      DB_PASSWORD: lab_password
      DB_NAME: lab_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: lab_docker_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lab_db
      MYSQL_USER: lab_user
      MYSQL_PASSWORD: lab_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
